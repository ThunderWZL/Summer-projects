[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siteppe-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ai = [
  "chromadb>=1.0,<2",
  "langchain>=0.3,<2",
  "langchain-deepseek>=0.1,<2",
  "langchain-openai>=0.3,<2",
  "openai>=1.60,<3",
]
vision = [
  "opencv-python-headless>=4.10,<5",
  "supervision>=0.25,<1",
  "ultralytics>=8.3,<9",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_rag: requires configured embedding credentials and local authoritative corpus",
]

[tool.setuptools.packages.find]
include = ["app*"]
